name: BCC regression reproduction bundle
on:
  workflow_dispatch:
  push:
    branches: ['feat/bcc-design-v107']
    paths: ['.github/workflows/bcc-reproduction.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce locked build inputs without production credentials
        working-directory: apps/control-center
        run: |
          npm ci --no-audit --no-fund
          npm run assets
          npm exec -- electron --version --no-sandbox || true
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/bcc-source.tar.gz"
          tar -czf "$RUNNER_TEMP/bcc-dependencies.tar.gz" node_modules .generated
          git rev-parse HEAD > "$RUNNER_TEMP/bcc-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bcc-regression-reproduction
          path: |
            ${{ runner.temp }}/bcc-source.tar.gz
            ${{ runner.temp }}/bcc-dependencies.tar.gz
            ${{ runner.temp }}/bcc-commit.txt
          retention-days: 3
          if-no-files-found: error
