# One-use transport for the locally tested V107 source patch. Remove after import.
name: Import and validate V107 implementation
on:
  push:
    branches: ['feat/bcc-design-v107']
    paths: ['.github/workflows/bcc-v107-import.yml', '.github/v107-import/**']
permissions:
  contents: write
concurrency:
  group: bcc-v107-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/feat/bcc-design-v107'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact base and patch, then apply only app changes
        env:
          PATCH_FILE: ${{ runner.temp }}/bcc-v107.patch
        run: |
          test "$(git rev-parse HEAD^)" = 9893bdd4f1d9f2b43e689727b462ce335ad93800
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          root = pathlib.Path('.github/v107-import')
          payload = ''.join((root / f'part{i}.b64').read_text() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '122295b2bfec7d58703ac61dc1e33b37135ce2a69d32c5e35c6c038302083c04'
          pathlib.Path(os.environ['PATCH_FILE']).write_bytes(patch)
          PY
          git apply --check --index --directory=apps/control-center "$PATCH_FILE"
          git apply --index --directory=apps/control-center "$PATCH_FILE"
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert len(paths) == 30
          assert all(p.startswith('apps/control-center/') and '..' not in p.split('/') for p in paths)
          PY
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement V107 live desk and confirmed OBS interaction model'
          git push origin HEAD:refs/heads/feat/bcc-design-v107
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: apps/control-center
        run: npm ci --no-audit --no-fund
      - name: Typecheck, bundle and regression tests
        working-directory: apps/control-center
        run: |
          mkdir -p release/v107
          git rev-parse HEAD > release/v107/commit.txt
          npm run typecheck 2>&1 | tee release/v107/typecheck.log
          npm run build 2>&1 | tee release/v107/build.log
          npm test 2>&1 | tee release/v107/tests.log
      - name: Native Electron acceptance against synthetic OBS
        working-directory: apps/control-center
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/smoke-v107.cjs 2>&1 | tee release/v107/native.log
      - name: Preserve exact implementation source
        if: always()
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/bcc-v107-implemented-source.tar.gz" HEAD apps/control-center
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bcc-v107-import-validation
          path: |
            apps/control-center/release/v107/**
            ${{ runner.temp }}/bcc-v107-implemented-source.tar.gz
          retention-days: 14
