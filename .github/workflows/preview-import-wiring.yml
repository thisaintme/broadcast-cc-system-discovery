name: Import exact reviewed stream-management tests
on:
  push:
    branches: ['preview/stream-management-dmg']
    paths: ['.github/workflows/preview-import-wiring.yml']
permissions: {contents: write}
jobs:
  import:
    if: github.ref == 'refs/heads/preview/stream-management-dmg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original source digest and commit to the preview branch
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          target=apps/control-center/tests/stream-management.test.mjs
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/c7459af42b35447e58d6d683f04c6122db7c1b2e" --jq .content | base64 -d | sed 's/if(reads===2)f.de.events.get(o.targets\[0\].broadcastId)/if(reads===2)f.de.events.get(id)/' > "$target"
          echo "6d2751e61480d3dd88451f01c2328e93f3a8584fa3090a6f7f877a79ce2a8e7c  $target" | sha256sum -c -
          test "$(git hash-object "$target")" = 8f93b873269370ec738bae26e0740395ebc73267
          git add "$target"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(preview): check in stream-management regressions'
          git push origin HEAD:refs/heads/preview/stream-management-dmg
