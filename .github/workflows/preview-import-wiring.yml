name: Verify transferred regression source
on:
  push:
    branches: ['preview/stream-management-dmg']
    paths: ['.github/workflows/preview-import-wiring.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read the transferred source from this repository
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/c7459af42b35447e58d6d683f04c6122db7c1b2e" --jq .content | base64 -d > regression.mjs
      - uses: actions/upload-artifact@v4
        with: {name: regression-source-verification, path: regression.mjs, retention-days: 1}
