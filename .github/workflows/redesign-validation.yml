name: Redesign validation and macOS preview
on:
  push:
    branches: ['feat/konzept-b-secrets-series']
    paths: ['apps/control-center/**', '.github/workflows/redesign-validation.yml']
permissions:
  contents: read
concurrency:
  group: redesign-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export source snapshot for implementation and audit
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/redesign-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-source
          path: ${{ runner.temp }}/redesign-source.tar.gz
          if-no-files-found: error
          retention-days: 2
