name: Stream Management — tested Mac preview only
on:
  push:
    branches: ['preview/stream-management-dmg']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bcc-stream-management-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ARCHIVE: broadcast-cc-stream-management-implementation.zip
      SOURCE_SHA256: 31738ae2871c0266eebb6c5574488556eee7490522a5365875c514734f25efe1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Prepare approved preview inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$ARCHIVE" ]]; then
            echo "$SOURCE_SHA256  $ARCHIVE" | shasum -a 256 -c -
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/input"
            patch="$RUNNER_TEMP/input/stream-management-patch"
            node --test "$patch/validation/apply-package.test.mjs"
            node "$patch/apply-stream-management.mjs" "$GITHUB_WORKSPACE" --apply
            test -s apps/control-center/src/stream-management-main.ts
            test -s apps/control-center/tests/stream-management.test.mjs
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'Baseline validation only: the reviewed source ZIP has not landed. No installer will be packaged.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Snapshot exact sources for reproducible local validation
        run: tar -czf "$RUNNER_TEMP/preview-source.tgz" apps/control-center
      - uses: actions/upload-artifact@v4
        with:
          name: preview-validation-source
          path: ${{ runner.temp }}/preview-source.tgz
          retention-days: 7
      - name: Install dependencies
        working-directory: apps/control-center
        run: npm install --no-fund --no-audit
      - name: Typecheck integrated app
        working-directory: apps/control-center
        run: npm run typecheck
      - name: Application regression suite
        working-directory: apps/control-center
        run: npm test
      - name: Build Electron application
        working-directory: apps/control-center
        run: npm run build
      - name: Existing native Electron smoke tests
        working-directory: apps/control-center
        shell: bash
        run: |
          set -euo pipefail
          for suite in smoke smoke-obs smoke-offline smoke-audio smoke-service-audio smoke-readiness smoke-live smoke-operator; do
            ./node_modules/.bin/electron scripts/run-smoke.cjs "$suite.cjs"
          done
      - name: Stream Management renderer, account view and recurrence IPC smoke test
        if: steps.inputs.outputs.complete == 'true'
        working-directory: apps/control-center
        run: ./node_modules/.bin/electron scripts/smoke-stream-management.cjs
      - name: Package and verify the preview (no publishing)
        if: steps.inputs.outputs.complete == 'true'
        working-directory: apps/control-center
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'version=0.3.0-alpha.3'
          npm run dist:mac
          dmg=(release/*.dmg)
          test "${#dmg[@]}" -eq 1 && test -s "${dmg[0]}"
          hdiutil verify "${dmg[0]}"
          mount="$RUNNER_TEMP/dmg-review"; mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${dmg[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          apps=("$mount"/*.app); test "${#apps[@]}" -eq 1
          exe=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "${apps[0]}/Contents/Info.plist")
          lipo -verify_arch x86_64 arm64 "${apps[0]}/Contents/MacOS/$exe"
          ./node_modules/.bin/asar list "${apps[0]}/Contents/Resources/app.asar" > "$RUNNER_TEMP/contents.txt"
          for file in /dist/stream-management-preload.cjs /dist/renderer/stream-management.html /dist/renderer/stream-management-renderer.js; do grep -Fxq "$file" "$RUNNER_TEMP/contents.txt"; done
          (cd release && shasum -a 256 *.dmg > SHA256SUMS.txt)
          printf 'commit=%s\nsource_zip_sha256=%s\n' "$GITHUB_SHA" "$SOURCE_SHA256" > release/BUILD.txt
      - uses: actions/upload-artifact@v4
        if: success() && steps.inputs.outputs.complete == 'true'
        with:
          name: Stream-Management-Preview-macOS-universal
          path: |
            apps/control-center/release/*.dmg
            apps/control-center/release/SHA256SUMS.txt
            apps/control-center/release/BUILD.txt
            apps/control-center/release/smoke-stream-management.png
          if-no-files-found: error
          retention-days: 14
