<!doctype html><html lang="de"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live-Mitschrift</title><style>body{font:16px/1.5 system-ui;background:#fafaf7;color:#182a35;max-width:64rem;margin:2rem auto;padding:0 2rem}section{border-top:1px solid #a9b6b9;margin:1.5rem 0;padding-top:.5rem}button,select,input,textarea{font:inherit;padding:.45rem}button{cursor:pointer}label{display:block;font-weight:650}textarea,input{box-sizing:border-box;width:100%;margin:.3rem 0 1rem}textarea{height:12rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}.cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}@media(max-width:650px){.cols{grid-template-columns:1fr}}</style><h1>Live-Mitschrift</h1><p>Deutsch · Leseseite für persönliche Geräte. Es erscheinen keine Untertitel im Sendebild.</p><section><h2>Während der Sendung</h2><p id="state" role="status"></p><p id="route"></p><button id="arm" disabled>Freigeben</button></section><section><h2>Nach der Sendung</h2><p>Abgeschlossene Mitschrift wählen. Die Vorschau verändert das Video nicht.</p><label for="files">Lokale Mitschrift</label><select id="files"></select> <button id="preview">Titel und Beschreibung vorschlagen</button><p id="msg" role="status"></p><div id="editor" hidden><p id="target"></p><div class="cols"><div><h3>Derzeit auf YouTube</h3><strong id="beforeTitle"></strong><pre id="beforeDesc"></pre></div><div><h3>Bearbeitbarer Vorschlag</h3><label for="title">Titel</label><input id="title" maxlength="100"><label for="desc">Beschreibung</label><textarea id="desc"></textarea></div></div><button id="apply">Auf YouTube übernehmen</button></div></section><script src="review.js"></script></html>
